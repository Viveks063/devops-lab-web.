name: Docker Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Dockerfile
        run: docker --version

      - name: Validate HTML file
        run: test -s index.html

  build:
    needs: validate
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-lab-web:test .

      - name: Run container
        run: docker run -d --name test-web -p 8080:80 devops-lab-web:test

      - name: Test HTTP response
        run: curl --fail http://localhost:8080/
      
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: push the Image to docker repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag devops-lab-web:test ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab-web:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab-web:latest

      - name: Cleanup
        if: always()
        run: docker rm -f test-web || true
